# =============================================================================
# SDD DOMAIN SPEC: Discord Integration, Commands & Webhook Delivery
# =============================================================================
spec:
  id: "discord-integration-v1"
  status: draft
  version: "1.9.0"
  created: "2026-09-22"
  updated: "2026-11-04"

  version_policy:
    sync_group: "api-surface"
    depends_on: ["business-domain", "security"]

  changelog:
    - version: "1.9.0"
      date: "2026-11-04"
      changes:
        - "/guide browse (specs/tasks/2026-11-guide-browse.md), owner decisions 2026-11-04: a browse subcommand group beside the six look-up subcommands lists catalog entries 10 per page. Filters: item rarity/type/min-max level; creature class/min-max level; realm master realm/min-max level; master realm min-max level; relic realm; quest realm/min-max level. Text filters autocomplete stored values; realm filters autocomplete entries. Fixed level-ascending order (unlevelled last, then name; relics by realm then name). ◀ ▶ edit the requester's private list; a select (guide:bo) opens an entry as a new private card; Share posts the page publicly with working paging and select, which answer other members privately. List state is stateless in custom_ids (guide:b|bs:<kind code>:<page>:<filters>, at most 100 characters). Reuses the early acknowledgement and [guide] timing WARN; ERR logs carry operation and kind only (RULE-002). AC-DISC-001 registers the group; AC-DISC-008 added. Reader: catalogReader browse/filterValues/resolveFilterValue over migration 023's indexed virtual stat columns."
    - version: "1.8.0"
      date: "2026-11-04"
      changes:
        - "Owner request 2026-11-04: /guide Share posts the whole navigable card (relation menus, quest stage buttons, realm/master-realm button; no Share button) instead of a component-free copy. On a shared post those components open a private card for the member who clicks, and the post itself never changes. AC-DISC-007 updated (task spec AC-5)."
        - "/about (discord_modules/about.js) replies ephemerally with the version, the AGPL-3.0-or-later notice and link buttons to the source repository, TERMS.md, PRIVACY.md and LICENSE: the AGPL section 13 source offer for Discord users. AC-DISC-001 now registers /about."
        - "Quest stage layout (owner request 2026-11-04): renderCard splits stored stage text ('Label: value. … — story … reward') into Requirements, Story (block quote, at most 3200 characters) and Reward sections with a stage progress line; text without that shape renders unchanged. Display only; stored data and the parser are unchanged."
        - "Component latency (owner report 2026-11-04, stage button stuck loading with no log): a /guide click whose catalog read is unfinished 2 s after the click is acknowledged first and edited in; slow (over 1.5 s) or rejected responses log one WARN with delivery, read and response times and the error code."
        - "RULE-002: quickBuff no longer logs the game's quickbuff HTML when the report is missing or unrecognised; it logs the hint, response length and message count."
    - version: "1.7.0"
      date: "2026-11-03"
      changes:
        - "Catalog /guide (specs/tasks/2026-11-guide-catalog-reader.md, specs/tasks/2026-11-discord-guide.md), owner decisions 2026-11-03: /guide item|creature|realm|master-realm|relic|quest with a required autocompleted name reads GoGon's MySQL catalog through catalog/catalogReader.js and never guide.fallensword.com or the game. Replies are ephemeral; relation select menus, quest stage buttons and a realm/master-realm button update the same message; Share posts the current card publicly without components or mentions. Incomplete entries show a badge with the dashboard's reason wording. custom_ids are stateless (guide:go|open|stage|share), so menus survive restarts. AC-DISC-001 now registers /guide; AC-DISC-007 added. Commands remain ungated (owner decision 2026-09-24)."
    - version: "1.6.0"
      date: "2026-10-13"
      changes:
        - "Notification outbox (specs/tasks/2026-10-notification-outbox.md): claim-first monitor alerts are stored in notification_outbox (migration 014) in the same transaction as their dedupe ID and delivered by notificationDispatcher.js through the existing batch queue and 2000ms spacing. Discord acceptance marks a row delivered; a retryable failure keeps it pending with backoff (60s doubling, 30 min cap, 12 rounds) before it becomes failed; a 4xx is failed at once, and a rejected merged batch is retried one row at a time first. Rows replay at startup; webhook URLs resolve from the setting key at send time. queueDiscordMessage takes an optional { accountScope, onSettled, solo }; a queued alert whose account is no longer active is released unsent. Migration 015 identifies a row by (source, account_scope, event_id, part), so two accounts each keep their own alert for one game ID; at boot the outbox starts only after login() and ensureLogin() succeed (bootLogin.mjs), so a failed boot login sends nothing (counter-plan O1, O3). Duplicate window: an alert Discord accepted but MySQL did not record as delivered is re-sent once only if the process restarts before the acknowledgement lands. Owner view: GET /api/notifications and POST /api/notifications/:id/retry|discard (Notifications tab), with no payload or URL."
    - version: "1.5.0"
      date: "2026-10-13"
      changes:
        - "Delivery recovery (specs/tasks/2026-10-discord-delivery-recovery.md): every webhook request has a 15s deadline covering the body read; timeouts, network errors and 5xx get at most 3 attempts; other 4xx are permanent; 429 pauses only the limited webhook (bounded fallback and 60s cap, at most 5 per message) while other webhooks keep the 2000ms global spacing. The dispatcher sends the earliest-queued eligible webhook head; a retried item keeps its queue position, so fresh traffic for other webhooks cannot starve an eligible retry (counter-plan R1). Failed items are dropped with a sanitized ERR (hashed destination key, category, status). Constants live in webhooks.js."
    - version: "1.4.0"
      date: "2026-10-13"
      changes:
        - "Orchestrated domain metadata and requirements in place; existing acceptance criteria remain the detailed contract."
    - version: "1.3.0"
      date: "2026-09-24"
      changes:
        - "DISC-TASK-006 DONE (AC-DISC-001): tests/discord-integration/bot.test.mjs covers slash command registration (four commands with required options on the guild route, /guide unregistered), routing to each handler, ignored component/unknown interactions, error replies, and failed registration rejecting before login. discord.js Client/REST are faked; app.mjs's credential gate and engine-before-bot order are checked statically. No source changes."
    - version: "1.2.0"
      date: "2026-09-24"
      changes:
        - "Owner decision: /bebuff is not role-gated. Removed the GG_BE_ROLE_ID role check (dead, commented-out code) and its env read from inventory.js, the role requirement from AC-DISC-003, and the /bebuff role security rule."
        - "Recorded the /gvgcooldown 6000-character message limit as an accepted risk (constraints)."
        - "Added DISC-TASK-006 (TODO): tests for discordBot.mjs command registration and routing (AC-DISC-001)."
    - version: "1.1.0"
      date: "2026-09-24"
      changes:
        - "DISC-TASK-001/002 DONE: buffs.js and inventory.js read the getBuffs() { buffsList, parsedAt } shape through toBuffsList(), which also accepts a bare list or a failed (undefined) result; /checkbuffs replies 'has no active buffs' instead of failing when getBuffs fails."
        - "DISC-TASK-003 DONE (AC-DISC-004): gvg.js drops malformed cooldowns (non-string or blank guildName, non-finite expires) and splits fields into 25-field embeds, at most 10 per reply. Footer now reads the 10-day COOLDOWNS.GVG."
        - "DISC-TASK-004 DONE: 'epics' keyword and EPICS_IDS restored. NAME_TO_ID is keyed by normalized name, so named buffs resolve against the Title Case buff_data.json (they previously never matched)."
        - "DISC-TASK-005 DONE: fixture-only tests in tests/discord-integration/ (commands, gvg, delivery) cover the handlers above, 100ms/10-embed burst batching, the character-budget split, flushAllBatches, the 2000ms inter-post delay, and 429 retry_after backoff. discordBot.mjs command registration (AC-DISC-001) is not covered."
    - version: "1.0.0"
      date: "2026-09-22"
      changes:
        - "Initial domain specification for Discord bot slash commands, webhook delivery queue, 25-field embed chunking, and burst message batching."

domain:
  name: "Discord Integration, Commands & Webhook Delivery"
  description: |
    Handles Discord Bot lifecycle, gateway connection, slash command interactions (/buff, /bebuff,
    /checkbuffs, /gvgcooldown, /guide), permissions/role gating, and the outbound webhook delivery pipeline
    incorporating rate-limited sequential queues and burst message batching (up to 10 embeds per payload).

  id: discord-integration
  status: draft
  version: 0.1.0
  project_ref: specs/project.yaml
  constitution_ref: specs/constitution.yaml
  boundary: 'Handles Discord Bot lifecycle, gateway connection, slash command interactions (/buff, /bebuff,

    /checkbuffs, /gvgcooldown, /guide), permissions/role gating, and the outbound webhook delivery pipeline

    incorporating rate-limited sequential queues and burst message batching (up to 10 embeds per payload).'
  current_implementation: Monitor alerts are claimed into the MySQL notification outbox and delivered through the
    in-memory queue, which has a finite request deadline and bounded retries; failed rows stay inspectable to the owner
    (notification outbox, 2026-10-13). Direct sends (GvG live counter, other sendDiscordMessage callers) remain in-memory
    only. Historical AC-DISC-004 says SQLite, but live state is MySQL.
  requirements:
  - id: AC-DISC-001
    statement: Slash command registration and command routing
    scenarios:
    - given: Valid GG_DISCORD_TOKEN, GG_DISCORD_APP_ID, and GG_DISCORD_GUILD_ID in .env
      when: setupDiscord() is called during startup
      then: Registers /buff, /bebuff, /checkbuffs, /gvgcooldown, /guide (including the browse subcommand group), and
        /about with Discord REST API and binds interaction event listeners, including /guide autocomplete and guide
        components
    - given: Discord credentials missing from .env
      when: setupDiscord() is evaluated in app.mjs
      then: Logs warning and skips bot initialization without preventing scraper engine execution
  - id: AC-DISC-002
    statement: Checkbuffs pagination and duration calculation
    scenarios:
    - given: A player name provided to /checkbuffs
      when: handleCheckBuffsInteraction() executes
      then: Fetches active buffs and server timestamp (parsedAt) via getBuffs(), computes remaining duration (expire_time
        - parsedAt), and formats paginated embed with Next/Previous buttons
    - given: Player has no active buffs or player does not exist
      when: Command runs
      then: Replies with polite informational message '**[Username]** has no active buffs' without throwing error
  - id: AC-DISC-003
    statement: Buff casting and Buff Enhancer sequence
    scenarios:
    - given: User issues /buff or /bebuff command
      when: Command handler runs (no role gating; owner decision 2026-09-24)
      then: Executes buff sequence, verifies minimum required levels, and reports cast summary to Discord
    - given: Stamina is insufficient or required potions are missing
      when: Command runs
      then: Replies with descriptive rejection message and does not cast buffs
  - id: AC-DISC-004
    statement: GvG cooldown listing with 25-field embed chunking
    scenarios:
    - given: Active GvG cooldown records stored in SQLite
      when: /gvgcooldown command is triggered
      then: Filters valid entries with string guildName and numeric expires, formats remaining time, and splits
        fields into chunks of maximum 25 fields across multiple embeds
    - given: More than 25 active cooldowns exist simultaneously
      when: Embed is constructed
      then: Chunks fields into multiple embeds (max 25 fields per embed) to avoid Discord 400 Bad Request error
    - given: No active cooldowns exist
      when: Command is invoked
      then: Replies with '✅ There are currently no active GvG cooldowns.'
  - id: AC-DISC-005
    statement: Webhook delivery rate limiting and backoff
    scenarios:
    - given: Outbound messages added to Discord delivery queue
      when: processQueue() runs
      then: Enforces minimum 2000ms delay between consecutive webhook posts and backs off on HTTP 429 rate limit
    - given: Webhook returns 429 Too Many Requests with retry_after header
      when: Response is processed
      then: Retries the limited message no earlier than the indicated duration (bounded) while other webhooks keep
        sending with the global 2000ms spacing
  - id: AC-DISC-006
    statement: Burst notification batching
    scenarios:
    - given: Rapid burst of notifications arriving at the same webhook (e.g. 15 SE kills or 20 ladder bands)
      when: Messages enter batching queue
      then: Combines up to 10 embeds into a single webhook POST after 100ms idle timeout, cutting HTTP calls by
        up to 10x
    - given: Application initiates shutdown while messages are in batch queue
      when: flushAllBatches() is called
      then: Immediately posts all pending batched embeds synchronously before process termination
  - id: AC-DISC-007
    statement: Catalog look-ups with /guide (specs/tasks/2026-11-discord-guide.md)
    scenarios:
    - given: A member types in a /guide subcommand's name option
      when: Discord requests autocomplete
      then: Responds within the interaction deadline with at most 25 catalog matches labelled name and hint;
        a catalog failure or a 2.5 s deadline yields no choices and one WARN without the typed text
    - given: A member picks or types an entry
      when: The command runs
      then: Replies ephemerally with the entry's card from MySQL (badge when incomplete), relation menus and Share;
        an exact name match opens directly, several open a picker, none offers up to 5 suggestions
    - given: A member uses a card menu, stage button or Share
      when: The component interaction arrives, possibly after a restart
      then: On the requester's ephemeral card, menus and stages update that message; Share posts the whole card
        publicly with its menus and stage buttons but no Share button and no mentions; on a shared post, menus and
        stages reply with a private card and leave the post unchanged; a malformed custom_id expires and a deleted
        entry is reported, both ephemerally
    - given: The catalog database is unavailable
      when: Any /guide interaction runs
      then: Replies ephemerally that guide data is unavailable and logs one ERR with operation and kind only; no
        request reaches the game or guide.fallensword.com
  - id: AC-DISC-008
    statement: Filtered, paged catalog lists with /guide browse (specs/tasks/2026-11-guide-browse.md)
    scenarios:
    - given: A member types in a /guide browse text or realm filter
      when: Discord requests autocomplete
      then: Responds with at most 25 stored values (rarity, type, class) or catalog entries (realm, master realm); a
        failure or the 2.5 s deadline yields no choices and one WARN naming kind and option, without the typed text
    - given: A member runs /guide browse <kind> with filters
      when: The command runs
      then: Resolves typed values to their stored spelling or entry, then replies ephemerally with page 1 of at most 10
        entries in level-ascending order with filters, hints, an Incomplete marker, page and match counts; an unknown
        value or realm is reported instead of an empty list
    - given: A member uses ◀ ▶, the entry select or Share on a list, possibly after a restart
      when: The component interaction arrives
      then: On the requester's private list paging updates that message; the select opens a new private card; Share
        posts the page publicly with paging and select but no Share button and no mentions; on a shared post paging
        replies with a private list and the post never changes; malformed list state expires without a catalog read
  dependencies:
  - domain_ref: specs/auth-session.spec.yaml
    relationship: Slash commands invoke getBuffs and API calls through session layer.
  - domain_ref: specs/data-storage.spec.yaml
    relationship: Slash commands query GvG cooldowns and buff definitions from storage.
  evidence:
  - specs/discord-integration.spec.yaml acceptance_criteria and dependencies
  - app.mjs and relevant source paths named in this spec
  open_decisions: []

entities:
  - name: DiscordCommandInteraction
    description: "Inbound interaction received from Discord slash commands."
    fields:
      - name: commandName
        type: string
        constraints: [required]
        description: "Name of the invoked slash command (buff, bebuff, checkbuffs, gvgcooldown)."
        example: "checkbuffs"
      - name: userId
        type: string
        constraints: [required]
        description: "Discord user snowflake ID of the command issuer."
        example: "880193874662916166"
      - name: options
        type: json
        constraints: []
        description: "Arguments supplied to the command."
        example: '{"target": "ShadowHunter"}'

  - name: WebhookNotification
    description: "Outbound notification payload destined for a Discord webhook."
    fields:
      - name: webhookUrl
        type: string
        constraints: [required, sensitive]
        description: "Discord webhook endpoint URL loaded from .env."
        example: "https://discord.com/api/webhooks/123/abc"
      - name: content
        type: string
        constraints: []
        description: "Optional role mention text prefix (e.g. '<@&1142926613009408000>')."
        example: "<@&1142926613009408000>"
      - name: embeds
        type: json
        constraints: [required]
        description: "Array of Discord embed objects (up to 10 per message)."
        example: '[{"title": "Super Elite Spawn", "color": 15466240}]'

  - name: MessageBatch
    description: "Batched embed collection held in memory during burst notification events."
    fields:
      - name: webhookUrl
        type: string
        constraints: [required]
        description: "Target webhook for the batch."
        example: "https://discord.com/api/webhooks/..."
      - name: items
        type: json
        constraints: [required]
        description: "Array of pending embed payloads awaiting flush (max 10)."
        example: '[...]'
      - name: idleTimeout
        type: integer
        constraints: [required]
        description: "Delay in ms before flushing pending batch (100ms)."
        example: 100

acceptance_criteria:
  - id: AC-DISC-001
    description: "Slash command registration and command routing"
    given: "Valid GG_DISCORD_TOKEN, GG_DISCORD_APP_ID, and GG_DISCORD_GUILD_ID in .env"
    when: "setupDiscord() is called during startup"
    then: "Registers /buff, /bebuff, /checkbuffs, /gvgcooldown, /guide (including the browse subcommand group), and /about with Discord REST API and binds interaction event listeners, including /guide autocomplete and guide components"
    error_cases:
      - given: "Discord credentials missing from .env"
        when: "setupDiscord() is evaluated in app.mjs"
        then: "Logs warning and skips bot initialization without preventing scraper engine execution"

  - id: AC-DISC-002
    description: "Checkbuffs pagination and duration calculation"
    given: "A player name provided to /checkbuffs"
    when: "handleCheckBuffsInteraction() executes"
    then: "Fetches active buffs and server timestamp (parsedAt) via getBuffs(), computes remaining duration (expire_time - parsedAt), and formats paginated embed with Next/Previous buttons"
    error_cases:
      - given: "Player has no active buffs or player does not exist"
        when: "Command runs"
        then: "Replies with polite informational message '**[Username]** has no active buffs' without throwing error"

  - id: AC-DISC-003
    description: "Buff casting and Buff Enhancer sequence"
    given: "User issues /buff or /bebuff command"
    when: "Command handler runs (no role gating; owner decision 2026-09-24)"
    then: "Executes buff sequence, verifies minimum required levels, and reports cast summary to Discord"
    error_cases:
      - given: "Stamina is insufficient or required potions are missing"
        when: "Command runs"
        then: "Replies with descriptive rejection message and does not cast buffs"

  - id: AC-DISC-004
    description: "GvG cooldown listing with 25-field embed chunking"
    given: "Active GvG cooldown records stored in SQLite"
    when: "/gvgcooldown command is triggered"
    then: "Filters valid entries with string guildName and numeric expires, formats remaining time, and splits fields into chunks of maximum 25 fields across multiple embeds"
    error_cases:
      - given: "More than 25 active cooldowns exist simultaneously"
        when: "Embed is constructed"
        then: "Chunks fields into multiple embeds (max 25 fields per embed) to avoid Discord 400 Bad Request error"
      - given: "No active cooldowns exist"
        when: "Command is invoked"
        then: "Replies with '✅ There are currently no active GvG cooldowns.'"

  - id: AC-DISC-005
    description: "Webhook delivery rate limiting and backoff"
    given: "Outbound messages added to Discord delivery queue"
    when: "processQueue() runs"
    then: "Enforces minimum 2000ms delay between consecutive webhook posts and backs off on HTTP 429 rate limit"
    error_cases:
      - given: "Webhook returns 429 Too Many Requests with retry_after header"
        when: "Response is processed"
        then: "Retries the limited message no earlier than the indicated duration (bounded) while other webhooks keep sending with the global 2000ms spacing"

  - id: AC-DISC-006
    description: "Burst notification batching"
    given: "Rapid burst of notifications arriving at the same webhook (e.g. 15 SE kills or 20 ladder bands)"
    when: "Messages enter batching queue"
    then: "Combines up to 10 embeds into a single webhook POST after 100ms idle timeout, cutting HTTP calls by up to 10x"
    error_cases:
      - given: "Application initiates shutdown while messages are in batch queue"
        when: "flushAllBatches() is called"
        then: "Immediately posts all pending batched embeds synchronously before process termination"

security:
  constitutions:
    - SEC-OWASP-A01-2025   # Broken Access Control (slash commands are intentionally not role-gated; owner decision 2026-09-24)
    - SEC-OWASP-A02-2025   # Security Misconfiguration (Environment-backed webhook URLs)
    - SEC-OWASP-A04-2025   # Cryptographic Failures (Token protection)
    - SEC-OWASP-A10-2025   # Mishandling of Exceptional Conditions (Discord API rate limiting)

  project_specific:
    - rule: "Discord Bot token (GG_DISCORD_TOKEN) and Webhook URLs must never be hardcoded in source code or exposed in Git commits."
      severity: CRITICAL
      cwe: 798
      scope: "webhooks.js, discordBot.mjs, .env"
    - rule: "Discord webhook URLs must only target official Discord domains (https://discord.com/api/webhooks/ or https://discordapp.com/api/webhooks/)."
      severity: HIGH
      cwe: 918
      scope: "utils.js"

  threat_model:
    - threat: "Exhaustion of Discord API rate limits causing dropped game alerts"
      impact: "Critical alerts delayed or discarded; bot banned from Discord API"
      mitigation: "Centralized sequential queue with 2000ms inter-message delay and 10-embed burst batching"
      verification: "Stress test queue with 50 concurrent items and verify delivery timing and batch sizing"
    - threat: "Crash of bot interaction loop due to malformed getBuffs return value"
      impact: "Slash commands freeze and users receive 'Application did not respond'"
      mitigation: "Standardize getBuffs signature and handle both object { buffsList, parsedAt } and direct list consumers defensively"
      verification: "Unit test executing ensureMetaBuffs and checkPotionBuffs against getBuffs return value"

constraints:
  - "Maximum 25 fields per Discord embed (Discord API hard constraint)."
  - "Maximum 10 embeds per webhook POST (Discord API hard constraint)."
  - "Minimum 2000ms delay between consecutive individual webhook dispatches."
  - "Accepted risk (owner, 2026-09-24): /gvgcooldown does not enforce Discord's 6000-character total per message. That limit needs roughly 200+ simultaneous cooldowns, and the game has far fewer attackable guilds."

dependencies:
  - domain: "auth-session"
    relationship: "Slash commands invoke getBuffs and API calls through session layer."
    criticality: CRITICAL
  - domain: "data-storage"
    relationship: "Slash commands query GvG cooldowns and buff definitions from storage."
    criticality: HIGH

git:
  last_implementation_branch: ""
  last_pr_url: ""
  last_pr_merged: ""
  last_version_tag: ""

tasks:
  - id: DISC-TASK-001
    description: |
      Fix TypeError in discord_modules/buffs.js line 204.
      activeBuffsList receives { buffsList, parsedAt } from getBuffs(), but line 204 iterates
      it directly (for (const buff of activeBuffsList)). Update to access .buffsList property.
    affects: "discord_modules/buffs.js"
    depends_on: []
    source: "threat_model"
    status: DONE

  - id: DISC-TASK-002
    description: |
      Fix TypeError in discord_modules/inventory.js line 84.
      buffs receives { buffsList, parsedAt } from getBuffs(), but line 86 calls buffs.map().
      Update to extract .buffsList before mapping.
    affects: "discord_modules/inventory.js"
    depends_on: []
    source: "threat_model"
    status: DONE

  - id: DISC-TASK-003
    description: |
      Port 25-field embed chunking and defensive null/expires validation from
      backup/discord_modules/gvg.js into root discord_modules/gvg.js to prevent Discord 400 Bad Request.
    affects: "discord_modules/gvg.js"
    depends_on: []
    source: "AC-DISC-004"
    status: DONE

  - id: DISC-TASK-004
    description: |
      Restore 'epics' buff keyword resolution in discord_modules/buffs.js present in production backup
      (EPICS_IDS = [88,89,7,5,2,74,0,37,171,77,9,82,44,28,159,102,169,124]).
    affects: "discord_modules/buffs.js"
    depends_on: []
    source: "AC-DISC-003"
    status: DONE

  - id: DISC-TASK-005
    description: |
      Create automated unit tests for slash command handlers, message batching queue,
      and webhook rate limiting.
    affects: "tests/discord-integration/commands.test.mjs, tests/discord-integration/gvg.test.mjs, tests/discord-integration/delivery.test.mjs"
    depends_on: ["DISC-TASK-001", "DISC-TASK-002", "DISC-TASK-003", "DISC-TASK-004"]
    source: "acceptance_criteria"
    status: DONE

  - id: DISC-TASK-006
    description: |
      Add fixture-only tests for discordBot.mjs slash command registration and routing (AC-DISC-001):
      /buff, /bebuff, /checkbuffs, /gvgcooldown are registered through the Discord REST API (mocked),
      interactions route to their handlers, and missing Discord credentials skip bot startup without
      stopping the scraper engine. Not covered by DISC-TASK-005.
    affects: "tests/discord-integration/bot.test.mjs"
    depends_on: ["DISC-TASK-005"]
    source: "AC-DISC-001"
    status: DONE
